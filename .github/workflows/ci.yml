name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.86.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run lint 2>&1 | tee -a ci.log
      - run: npm run build 2>&1 | tee -a ci.log
      - run: cargo fmt --manifest-path contracts/event_ticket/Cargo.toml -- --check 2>&1 | tee -a ci.log
      - run: cargo test --manifest-path contracts/event_ticket/Cargo.toml 2>&1 | tee -a ci.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log
          if-no-files-found: ignore