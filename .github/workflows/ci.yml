name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run lint 2>&1 | tee -a ci.log
      - run: npm test 2>&1 | tee -a ci.log
      - run: npm run build 2>&1 | tee -a ci.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log
          if-no-files-found: ignore